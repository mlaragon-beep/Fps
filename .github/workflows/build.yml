
name: Build Levi SmoothSwitch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source code
        run: |
          unzip -o LeviSmoothSwitch-source.zip -d source

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and platform
        run: |
          sdkmanager --install "platforms;android-28" "ndk;28.2.13676358"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build ARM64 LeviPack
        shell: pwsh
        working-directory: source/LeviSmoothSwitch
        run: |
          ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: LeviSmoothSwitch-ARM64
          path: source/LeviSmoothSwitch/build-arm64-v8a/*.levipack
          if-no-files-found: error
          
