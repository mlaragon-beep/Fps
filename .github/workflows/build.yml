
name: Build Levi SmoothSwitch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build LeviPack
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: LeviSmoothSwitch
          path: build-*/*.levipack
          if-no-files-found: error
